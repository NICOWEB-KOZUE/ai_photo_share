{% extends "base.html" %}
{% block content %}
<h1>ログイン</h1>
<form method="post">
    {{ form.hidden_tag() }}
    {% for field in [form.email, form.password] %}
    <p>{{ field.label }} {{ field() }}</p>
    {% for error in field.errors %}<p role="alert">{{ error }}</p>{% endfor %}
    {% endfor %}
    {{ form.submit() }}
</form>
<p><a href="{{ url_for('register') }}">ユーザー登録はこちら</a></p>
{% endblock %}
